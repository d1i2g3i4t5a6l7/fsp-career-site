# Локальный стенд «ФСП Карьера»: docker compose up -d --build → сайт http://localhost:8080, API http://localhost:8010/docs
# Ключи моделей — в workspace/.env (без него работает заглушка LLM). Подробно — README.md.
name: fsp-hire

services:
  # Сайт: кабинеты кандидата и работодателя. Собирается Vite, отдаётся nginx
  web:
    build: ./frontend
    environment:
      # Общий пароль на сайт для показа наружу (логин fsp); пусто — сайт открыт
      SITE_PASSWORD: ${SITE_PASSWORD:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Рабочее место кандидата, банк и генерация задач, проверка LLM-судьёй, грейд, шлюз к моделям.
  # Строго одна копия и один процесс: очереди к GigaChat, события WebSocket и фоновые проверки — в памяти.
  workspace:
    build: ./workspace
    env_file:
      - path: ./workspace/.env
        required: false
    environment:
      # Инфраструктура стенда — всегда отсюда, а не из .env
      DATABASE_URL: postgresql+asyncpg://fsp:${POSTGRES_PASSWORD:-fsp}@postgres:5432/workspace
      SANDBOX: piston
      PISTON_URL: unix:/run/runner/runner.sock
    ports:
      # Только с этой машины: авторизации пока нет, а GET /tasks/{id} отдаёт эталон
      - "127.0.0.1:${WORKSPACE_PORT:-8010}:8010"
    volumes:
      - runner-socket:/run/runner
    depends_on:
      postgres:
        condition: service_healthy
      runner:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Песочница для кода кандидата: без сети вообще, API — unix-сокет в общем томе
  runner:
    build: ./runner
    network_mode: none
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m
    volumes:
      - runner-socket:/run/runner
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 256
    cpus: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.socket(socket.AF_UNIX).connect('/run/runner/runner.sock')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Postgres с pgvector: сейчас база workspace, дальше — core-api и Keycloak
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: fsp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fsp}
      POSTGRES_DB: workspace
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsp -d workspace"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  runner-socket:
