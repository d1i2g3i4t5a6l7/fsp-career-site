# Сайт и пересылка его запросов к бэкенду: сайт обращается к workspace по своему же адресу
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Общий пароль на весь сайт, если задан SITE_PASSWORD (файл пишет site-password.sh при старте; без пароля он пустой)
    include /etc/nginx/site-auth.conf;

    # Жив ли контейнер — без пароля
    location = /healthz {
        auth_basic off;
        access_log off;
        return 200 "ok\n";
    }

    # Наружу — только то, чем пользуется сайт (frontend/api.js): тест, ассистент, результат, грейд, проверка оценок.
    # Служебное — генерация задач, задачи с эталоном и критериями, одобрение задач, перепроверка, журнал, Swagger —
    # только с машины, где стоит стенд: http://localhost:8010
    location ~ "^/api/workspace/(attempts(/[0-9a-f]{32}(/(files|assistant|tests|submit|focus|result|review|edits/[0-9]+/(accept|reject)))?)?|candidates/[^/]+/(grade|attempts)|reviews|health)$" {
        # Адрес workspace спрашиваем у Docker при каждом запросе: после пересоздания контейнера он может смениться
        resolver 127.0.0.11 valid=10s;
        set $workspace http://workspace:8010;
        rewrite ^/api/workspace/(.*)$ /$1 break;
        proxy_pass $workspace;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Ответ ассистента может идти несколько минут: до 25 шагов модели
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 5m;
    }

    location /api/ {
        return 404;
    }
}
